basePath: /
definitions:
  api.ErrorResponse:
    properties:
      error:
        example: Resource not found
        type: string
    type: object
  auth.AuthResponse:
    properties:
      UserID:
        example: 1
        type: integer
      token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      username:
        example: johndoe
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        example: MyP@ssw0rd!
        type: string
      username:
        example: gopher
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      activity_level:
        enum:
        - Sedentary
        - Lightly Active
        - Moderately Active
        - Very Active
        - Extra Active
        example: Moderately Active
        type: string
      age:
        example: 25
        type: integer
      gender:
        enum:
        - Male
        - Female
        - Other
        example: Male
        type: string
      goals:
        example:
        - Build Muscle
        - Lose Weight
        items:
          type: string
        type: array
      height:
        example: 180
        type: integer
      name:
        example: Mr. Fit
        type: string
      password:
        example: MyP@ssw0rd!
        type: string
      sports:
        example:
        - Basketball
        - Football
        items:
          type: string
        type: array
      username:
        example: gopher
        type: string
      weight:
        example: 75
        type: integer
    type: object
  nutrition.MacroGoals:
    properties:
      calories_target:
        example: 2000
        type: integer
      carbs_target:
        example: 200
        type: integer
      fat_target:
        example: 65
        type: integer
      protein_target:
        example: 150
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
  nutrition.Meal:
    properties:
      date:
        example: "2024-01-15"
        type: string
      id:
        example: 1
        type: integer
      items:
        items:
          $ref: '#/definitions/nutrition.MealItem'
        type: array
      meal_type:
        enum:
        - Breakfast
        - Lunch
        - Dinner
        - Snack
        example: Lunch
        type: string
      time:
        example: "12:30"
        type: string
      total_calories:
        example: 650
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
  nutrition.MealItem:
    properties:
      calories:
        example: 300
        type: integer
      carbs:
        example: 5
        type: integer
      fat:
        example: 12
        type: integer
      id:
        example: 1
        type: integer
      meal_id:
        example: 1
        type: integer
      name:
        example: Grilled Chicken
        type: string
      protein:
        example: 35
        type: integer
    type: object
  profile.Profile:
    properties:
      activity_level:
        enum:
        - Sedentary
        - Lightly Active
        - Moderately Active
        - Very Active
        - Extra Active
        example: Moderately Active
        type: string
      age:
        example: 25
        type: integer
      gender:
        enum:
        - Male
        - Female
        - Other
        example: Male
        type: string
      goals:
        example:
        - Build Muscle
        - Lose Weight
        items:
          type: string
        type: array
      height:
        example: 180
        type: integer
      name:
        example: John Doe
        type: string
      sports:
        example:
        - Basketball
        - Football
        items:
          type: string
        type: array
      user_id:
        example: 1
        type: integer
      weight:
        example: 75
        type: integer
    type: object
  profile.PublicProfile:
    properties:
      user_id:
        example: 1
        type: integer
      username:
        example: gopher
        type: string
    type: object
  profile.UpdatePassReq:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  profile.UpdateUserReq:
    properties:
      username:
        type: string
    type: object
  social.Friendship:
    properties:
      action_user_id:
        example: 1
        type: integer
      status:
        enum:
        - pending
        - accepted
        - blocked
        example: pending
        type: string
      user1_id:
        example: 1
        type: integer
      user2_id:
        example: 2
        type: integer
    type: object
  social.LeaderboardEntry:
    properties:
      max_weight:
        example: 135.5
        type: number
      percentile:
        example: 100
        type: number
      rank:
        example: 1
        type: integer
      user_id:
        example: 1
        type: integer
      username:
        example: gopher
        type: string
    type: object
  social.MuscleRank:
    properties:
      exercise_key:
        example: bench press
        type: string
      exercise_name:
        example: Bench Press
        type: string
      max_weight:
        example: 135.5
        type: number
      percentile:
        example: 100
        type: number
      rank:
        example: 1
        type: integer
      source_workout_item_id:
        example: 12
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
  workouts.Workout:
    properties:
      duration:
        example: 60
        type: integer
      id:
        example: 1
        type: integer
      items:
        items:
          $ref: '#/definitions/workouts.WorkoutItem'
        type: array
      user_id:
        example: 1
        type: integer
      workout_name:
        example: Morning Strength Training
        type: string
    type: object
  workouts.WorkoutItem:
    properties:
      duration_minutes:
        example: 5
        type: number
      exercise_name:
        example: Bench Press
        type: string
      id:
        example: 1
        type: integer
      reps:
        example: 10
        type: integer
      sets:
        example: 3
        type: integer
      weight:
        example: 135.5
        type: number
      workout_id:
        example: 1
        type: integer
    type: object
host: localhost:3000
info:
  contact: {}
  description: Fitness tracking API for workouts, nutrition, and user profiles
  title: GopherFit API
  version: "1.0"
paths:
  /auth/login:
    post:
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
      summary: Register new user
      tags:
      - auth
  /nutrition/macros:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.MacroGoals'
      security:
      - BearerAuth: []
      summary: Get macro goals
      tags:
      - nutrition
    put:
      parameters:
      - description: Macro goals
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nutrition.MacroGoals'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.MacroGoals'
      security:
      - BearerAuth: []
      summary: Update macro goals
      tags:
      - nutrition
  /nutrition/meals:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/nutrition.Meal'
            type: array
      security:
      - BearerAuth: []
      summary: Get user meals
      tags:
      - nutrition
    post:
      parameters:
      - description: Meal data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nutrition.Meal'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/nutrition.Meal'
      security:
      - BearerAuth: []
      summary: Create a meal
      tags:
      - nutrition
  /nutrition/meals/{id}:
    delete:
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete meal
      tags:
      - nutrition
    get:
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.Meal'
      security:
      - BearerAuth: []
      summary: Get meal by ID
      tags:
      - nutrition
    put:
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      - description: Meal data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nutrition.Meal'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.Meal'
      security:
      - BearerAuth: []
      summary: Update meal
      tags:
      - nutrition
  /nutrition/meals/{id}/items:
    post:
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      - description: Meal item data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nutrition.MealItem'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/nutrition.MealItem'
      security:
      - BearerAuth: []
      summary: Add item to meal
      tags:
      - nutrition
  /nutrition/meals/{id}/items/{itemId}:
    delete:
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: itemId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete meal item
      tags:
      - nutrition
    put:
      consumes:
      - application/json
      description: Updates an item only within a meal owned by the caller. IDs come
        from the path; body IDs are ignored. Name must be nonblank and nutrition values
        must be nonnegative integers.
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: itemId
        required: true
        type: integer
      - description: Meal item data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nutrition.MealItem'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.MealItem'
        "400":
          description: Invalid IDs, JSON, name, or nutrition values
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Meal item missing or not owned by caller
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Database failure
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update meal item
      tags:
      - nutrition
  /profile/:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile.Profile'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - profile
    put:
      parameters:
      - description: Profile data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile.Profile'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile.Profile'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - profile
  /profile/{id}:
    get:
      description: Returns only user_id and username. Requires authentication. Private
        attributes remain available only through GET /profile/ for the caller.
      parameters:
      - description: Positive user ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile.PublicProfile'
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Database failure
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Look up a user's public username
      tags:
      - profile
  /profile/password:
    put:
      parameters:
      - description: Password update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile.UpdatePassReq'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update password
      tags:
      - profile
  /profile/username:
    put:
      parameters:
      - description: Username update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile.UpdateUserReq'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update username
      tags:
      - profile
  /social/friendships:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.Friendship'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users relationships
      tags:
      - social
    post:
      consumes:
      - application/json
      description: Both user IDs must exist and include the caller. Only pending or
        blocked may be created. action_user_id is always set to the caller; a supplied
        value is ignored.
      parameters:
      - description: Friendship data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/social.Friendship'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/social.Friendship'
        "400":
          description: Invalid IDs, status, or JSON
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Relationship already exists
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a relationship
      tags:
      - social
  /social/friendships/{user2_id}:
    delete:
      description: Either participant may delete pending or accepted relationships.
        Only the user who created a block may delete it. An incoming block cannot
        be removed by the blocked user.
      parameters:
      - description: Friend ID
        in: path
        name: user2_id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID or cannot delete another user's block
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Relationship not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Relationship changed concurrently; reload before retrying
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete friendship
      tags:
      - social
    get:
      parameters:
      - description: friend's id
        in: path
        name: user2_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/social.Friendship'
        "400":
          description: Invalid or self user ID
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get relationship by friend's id
      tags:
      - social
    put:
      consumes:
      - application/json
      description: Only the recipient may accept a pending request. Either participant
        may block unless already blocked by the other user. A block's owner may change
        it to pending; accepted relationships may return to pending. Same-status changes
        are rejected. IDs must match the existing pair; action_user_id is set to the
        caller.
      parameters:
      - description: Friend ID
        in: path
        name: user2_id
        required: true
        type: integer
      - description: Friendship data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/social.Friendship'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/social.Friendship'
        "400":
          description: Invalid IDs, status, JSON, or forbidden transition
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Relationship not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Relationship changed concurrently; reload before retrying
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update Friendship
      tags:
      - social
  /social/friendships/accepted:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.Friendship'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users accepted friends
      tags:
      - social
  /social/friendships/inblocks:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.Friendship'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users incoming blocks
      tags:
      - social
  /social/friendships/inpending:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.Friendship'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users incoming friend requests
      tags:
      - social
  /social/friendships/outblocks:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.Friendship'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users outgoing blocks
      tags:
      - social
  /social/friendships/outpending:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.Friendship'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users outgoing friend requests
      tags:
      - social
  /social/leaderboard:
    get:
      description: Ranks each participant's highest positive weight using descending
        dense rank. Percentile is 100 times participants at or below the weight divided
        by all participants of the exercise. Ties share rank and percentile. Names
        are matched ignoring case and collapsed whitespace. Unknown exercises return
        an empty array. This replaces the static score leaderboard.
      parameters:
      - description: Exercise name
        example: Bench Press
        in: query
        name: exercise
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.LeaderboardEntry'
            type: array
        "400":
          description: Exercise is required
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a per-exercise leaderboard
      tags:
      - social
  /social/muscle-ranks:
    get:
      description: Returns only the caller's positive-weight records, ordered by normalized
        exercise name. Rank and percentile are calculated across all participants
        of each exercise before filtering to the caller. Percentile counts users at
        or below the record; ties share descending dense rank. Empty results are an
        array.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/social.MuscleRank'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the caller's personal exercise records and ranks
      tags:
      - social
  /workouts/:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/workouts.Workout'
            type: array
      security:
      - BearerAuth: []
      summary: Get user workouts
      tags:
      - workouts
    post:
      description: Creates the workout and its exercise records atomically. Item names
        must be nonblank and weights finite and nonnegative; only positive weights
        enter rankings.
      parameters:
      - description: Workout data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/workouts.Workout'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/workouts.Workout'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a workout
      tags:
      - workouts
  /workouts/{id}:
    delete:
      description: Deletes the workout and its items and recalculates affected personal
        records in one transaction.
      parameters:
